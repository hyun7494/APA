spring:
  application:
    name: app-fishing

  mvc:
    problemdetails:
      # ResponseStatusException 에 적은 이유(reason)를 응답 본문에 실어 보낸다.
      #
      # 이게 꺼져 있으면 부트의 옛 오류 모양({timestamp,status,error,path})으로 나가는데,
      # 거기에는 문구를 담을 자리가 message 뿐이고 그마저 기본값이 never 라 잘려 나간다.
      # 그래서 "어종을 찾을 수 없습니다"·"제목을 입력해 주세요" 같은 안내가 **하나도
      # 사용자에게 닿지 않았다** — 앱은 전부 "잠시 후 다시 시도해 주세요"로 뭉갠다.
      #
      # 켜면 auth-service 와 같은 RFC 7807 모양이 되고, 프론트가 읽는 자리도 `detail` 하나로 같아진다.
      enabled: true

  datasource:
    # ⚠️ 컨테이너의 localhost 는 자기 자신이다 (auth-service 와 같은 규칙).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apa}?currentSchema=fishing
    username: ${DB_USER:apa_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate     # 스키마는 Flyway가 만든다
    open-in-view: false

  flyway:
    schemas: fishing
    default-schema: fishing
    create-schemas: true     # fishing 스키마가 없으면 만들어준다

  servlet:
    multipart:
      # ⚠️ 기본값이 1MB 라 그냥 두면 스마트폰 사진(3~8MB)이 전부 거부된다.
      #    fishing.photo.max-bytes 와 맞춰야 한다 — 여기가 더 작으면 우리 검증이 돌기도 전에
      #    컨테이너가 먼저 끊어서 안내 문구가 달라진다.
      max-file-size: 15MB
      # ⚠️ 조과 등록은 한 번에 **최대 5장**이다 (V11). 한 장 한도(15MB)의 5배를 담을 수 있어야
      #    한다 — 20MB 로 두면 두 장째부터 컨테이너가 먼저 끊어서, 우리 안내 문구 대신
      #    정체 모를 500 이 사용자에게 간다.
      max-request-size: 80MB   # 파일 + 폼 필드 전체 (15MB × 5 + 여유)

server:
  port: ${SERVER_PORT:8086}

jwt:
  # ⚠️ auth-service 와 **같은 값이어야 한다** — HS256 대칭키라 발급(auth-service)과
  #    검증(여기)이 키를 공유하지 않으면 로그인해도 /fishing/me/** 가 전부 401 이다.
  #    운영은 두 모듈에 같은 JWT_SECRET 환경변수를 주입할 것.
  # ⚠️ 기본값 없음 — auth-service 와 같은 이유다. 없으면 부팅이 실패한다.
  secret: ${JWT_SECRET}
  # expiration 은 발급할 때만 쓰므로 여기 없다 (기본값 1시간)

logging:
  level:
    root: INFO
    org.springframework.web: INFO

fishing:
  api:
    # Step 6(공공 API 배치)에서 사용. 그 전까지는 비어 있어도 부팅에 지장 없다.
    # 공공데이터포털은 Encoding/Decoding 두 키를 주는데 반드시 Decoding 키를 넣을 것
    kma-service-key: ${KMA_SERVICE_KEY:}     # 기상청
    khoa-service-key: ${KHOA_SERVICE_KEY:}   # 국립해양조사원

  withdrawn:
    # 탈퇴자 꼬리표(`탈퇴한 사용자 a3f9`)를 만드는 해시에 섞는 값.
    #
    # ⚠️ **기본값이 없다.** 예전엔 소스에 `apa-local-dev` 가 박혀 있었고 어디에서도
    #    주입되지 않아 늘 그 값으로 돌았다. 공개 저장소라 그 값을 아는 누구나
    #    `SHA256(비밀값 + id)` 를 1 부터 돌려 **꼬리표를 내부 user_id 로 되짚을 수 있다.**
    #    익명화를 하고 있다고 믿는 채로 안 하고 있는 상태였다.
    #
    # ⚠️ **한 번 정하면 바꾸지 말 것.** 바꾸면 이미 가려진 글의 꼬리표가 전부 달라져서
    #    같은 사람의 옛 글과 새 글이 다른 사람처럼 보인다.
    secret: ${WITHDRAWN_SECRET}

  photo:
    # 조과 인증샷 저장 위치 (기획서 4-3). 상대 경로면 앱의 작업 디렉터리 기준이다.
    # ⚠️ 로컬 볼륨이라 컨테이너로 옮길 때 반드시 볼륨을 마운트할 것 — 안 하면 재배포마다
    #    사용자 도감의 표지 사진이 통째로 사라진다.
    dir: ${PHOTO_DIR:data/photos}
    max-bytes: 15728640   # 15MB. spring.servlet.multipart.max-file-size 와 같은 값
    max-edge: 1280        # 긴 변 목표 픽셀
    thumb-edge: 320       # 도감 그리드용 썸네일
    quality: 0.8          # JPEG 품질 80

cors:
  # 브라우저에서 이 API 를 부를 수 있는 출처. 쉼표로 여러 개.
  # ⚠️ 기본값은 로컬 개발용이다. **배포에서는 실제 도메인만 넣을 것.**
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        # ⚠️ health 만 연다. 기본값도 health 뿐이지만 명시해 둔다 — 나중에 누가
        #    `*` 로 열면 env·configprops 로 **비밀값이 그대로 노출**된다.
        include: health
  endpoint:
    health:
      # 도커 헬스체크가 DB 연결까지 보고 판단하도록 상세를 남긴다.
      show-details: when_authorized
      probes:
        enabled: true
