spring:
  application:
    name: app-fishing

  datasource:
    url: jdbc:postgresql://localhost:5432/apa?currentSchema=fishing
    username: apa_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate     # 스키마는 Flyway가 만든다
    open-in-view: false

  flyway:
    schemas: fishing
    default-schema: fishing
    create-schemas: true     # fishing 스키마가 없으면 만들어준다

  servlet:
    multipart:
      # ⚠️ 기본값이 1MB 라 그냥 두면 스마트폰 사진(3~8MB)이 전부 거부된다.
      #    fishing.photo.max-bytes 와 맞춰야 한다 — 여기가 더 작으면 우리 검증이 돌기도 전에
      #    컨테이너가 먼저 끊어서 안내 문구가 달라진다.
      max-file-size: 15MB
      max-request-size: 20MB   # 파일 + 폼 필드 전체

server:
  port: 8086

jwt:
  # ⚠️ auth-service 와 **같은 값이어야 한다** — HS256 대칭키라 발급(auth-service)과
  #    검증(여기)이 키를 공유하지 않으면 로그인해도 /fishing/me/** 가 전부 401 이다.
  #    운영은 두 모듈에 같은 JWT_SECRET 환경변수를 주입할 것.
  secret: ${JWT_SECRET:test1234test1234test1234test1234test1234test1234}
  # expiration 은 발급할 때만 쓰므로 여기 없다 (기본값 1시간)

logging:
  level:
    root: INFO
    org.springframework.web: INFO

fishing:
  api:
    # Step 6(공공 API 배치)에서 사용. 그 전까지는 비어 있어도 부팅에 지장 없다.
    # 공공데이터포털은 Encoding/Decoding 두 키를 주는데 반드시 Decoding 키를 넣을 것
    kma-service-key: ${KMA_SERVICE_KEY:}     # 기상청
    khoa-service-key: ${KHOA_SERVICE_KEY:}   # 국립해양조사원

  photo:
    # 조과 인증샷 저장 위치 (기획서 4-3). 상대 경로면 앱의 작업 디렉터리 기준이다.
    # ⚠️ 로컬 볼륨이라 컨테이너로 옮길 때 반드시 볼륨을 마운트할 것 — 안 하면 재배포마다
    #    사용자 도감의 표지 사진이 통째로 사라진다.
    dir: ${PHOTO_DIR:data/photos}
    max-bytes: 15728640   # 15MB. spring.servlet.multipart.max-file-size 와 같은 값
    max-edge: 1280        # 긴 변 목표 픽셀
    thumb-edge: 320       # 도감 그리드용 썸네일
    quality: 0.8          # JPEG 품질 80
