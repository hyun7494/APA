spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/apa?currentSchema=auth
    username: apa_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    schemas: auth
    default-schema: auth

server:
  port: 8081

logging:
  level:
    root: INFO
    org.springframework.web: INFO

jwt:
  secret: ${JWT_SECRET:test1234test1234test1234test1234test1234test1234}  # 32바이트 이상. 운영은 JWT_SECRET 환경변수로 주입
  expiration: 3600000 # 1시간 (1000 * 60 * 60)