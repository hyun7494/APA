# 로컬에서 전체를 한 번에 띄운다. 배포 환경은 여기서 갈라져 나가되
# **환경변수 목록은 같다** — 그래야 로컬에서 되던 게 배포에서 안 되는 일이 준다.
#
# 비밀값은 저장소 밖 `../apa-secrets.env` 에서 온다:
#   docker compose --env-file ../apa-secrets.env up -d --build
#
# ⚠️ 그 파일에 없는 값은 아래 required 표시를 보고 채울 것.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-apa}
      POSTGRES_USER: ${DB_USER:-apa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요하다}
      TZ: Asia/Seoul
    volumes:
      # 이름 있는 볼륨이다. `docker compose down` 으로는 안 지워진다 —
      # 지우려면 `down -v` 를 명시해야 한다.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # ⚠️ 포트가 열리는 것과 **질의를 받는 것**은 다르다. pg_isready 로 봐야
      #    Flyway 가 붙는 순간 준비돼 있다.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-apa_user} -d ${DB_NAME:-apa}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # 로컬에서 psql 로 들여다볼 수 있게 연다. 배포에서는 이 줄을 지울 것.
      # ⚠️ 호스트 쪽은 **5433** 이다. 개발 노트북에 이미 Postgres 가 5432 를 쓰고 있어서
      #    5432 로 열면 컨테이너가 못 뜬다 — 그렇다고 그쪽을 끄면 개발 DB 를 건드리게 된다.
      #    컨테이너 안 서비스들은 여전히 `postgres:5432` 로 서로를 부른다.
      - "${DB_PORT_HOST:-5433}:5432"

  auth-service:
    build: .
    environment:
      SERVICE: auth-service
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-apa}
      DB_USER: ${DB_USER:-apa_user}
      DB_PASSWORD: ${DB_PASSWORD:?}
      # ★ 두 서비스가 **같은 값**이어야 한다 (HS256 대칭키). 다르면 로그인은 되는데
      #   /fishing/me/** 가 전부 401 이 된다 — 원인을 찾기 어려운 종류의 어긋남이다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요하다 (32바이트 이상)}
      # 배포에서는 절대 켜지 말 것 — 켜면 누구나 userId=1 토큰을 받아간다.
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-false}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    ports:
      - "8081:8081"

  app-fishing:
    build: .
    environment:
      SERVICE: app-fishing
      SERVER_PORT: 8086
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-apa}
      DB_USER: ${DB_USER:-apa_user}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}

      # 탈퇴자 꼬리표를 만드는 해시의 소금. 없으면 부팅이 실패한다 —
      # 예전엔 소스에 박힌 기본값으로 돌아서 꼬리표를 user_id 로 되짚을 수 있었다.
      # ⚠️ 한 번 정하면 바꾸지 말 것. 바꾸면 이미 가려진 글의 꼬리표가 전부 달라진다.
      WITHDRAWN_SECRET: ${WITHDRAWN_SECRET:?WITHDRAWN_SECRET 이 필요하다 (16자 이상)}
      # 공공 API 키. 없어도 부팅은 되고 지수 배치만 건너뛴다.
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      KHOA_SERVICE_KEY: ${KHOA_SERVICE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      PHOTO_DIR: /var/lib/apa/photos
    volumes:
      # ★ **인증샷 볼륨.** 없으면 재배포마다 사용자 도감의 표지 사진이 통째로 사라진다.
      #   컨테이너 안 경로는 PHOTO_DIR 와 같아야 한다.
      - photos:/var/lib/apa/photos
    depends_on:
      postgres:
        condition: service_healthy
      # auth 가 먼저 떠야 하는 건 아니지만, 로그인부터 해 보게 되므로 순서를 맞춰 둔다.
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      # 부팅 직후 지수 배치가 51곳 × 공공 API 를 돈다(약 60초). 그동안 죽었다고
      # 판정하지 않도록 start_period 를 넉넉히 준다.
      retries: 12
      start_period: 120s
    ports:
      - "8086:8086"

volumes:
  pgdata:
  photos:
